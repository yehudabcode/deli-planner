<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deli Weekly Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg form{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
.dlg h2{font-family:var(--display);font-size:24px;margin:0}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.dlg label span{font-weight:400;color:var(--muted);font-size:12px}
.dlg input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;font:inherit;color:inherit}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end}
.dlg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;color:inherit}
.dlg button[type=submit]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dlg .msg{font-size:13px;color:var(--warn);min-height:1.2em;margin:0}

/* Layout: production-board header, 5 coloured day columns (the paper sheet), then a full product entry list for the selected day */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e9edef; --line:#d5dbdf; --fg:#1d2428; --muted:#5f6b72;
  --accent:#1f6f8b; --ok:#2f8a55; --warn:#b4541e;
  --mon:#2f78bb; --tue:#c9403f; --wed:#7449a8; --thu:#d9801f; --fri:#3a9358;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171a; --surface:#1a2125; --sunk:#232c31; --line:#334048; --fg:#e6ecef; --muted:#9aa7ae;
  --accent:#5fb3d1; --ok:#5cc489; --warn:#ef9a62;
  --mon:#5a9ee0; --tue:#e36b6a; --wed:#a07fd6; --thu:#eba04f; --fri:#62bd80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171a; --surface:#1a2125; --sunk:#232c31; --line:#334048; --fg:#e6ecef; --muted:#9aa7ae;
  --accent:#5fb3d1; --ok:#5cc489; --warn:#ef9a62;
  --mon:#5a9ee0; --tue:#e36b6a; --wed:#a07fd6; --thu:#eba04f; --fri:#62bd80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:3px solid var(--fg);padding-bottom:12px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1;margin:2px 0 0;text-wrap:balance}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
.weeknav button:hover{border-color:var(--fg)}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stage{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:transparent}
.stage.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.stage{cursor:pointer;font:inherit;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
button.stage:hover{border-color:var(--fg);color:var(--fg)}
.stage small{font-family:var(--body);letter-spacing:0;text-transform:none;font-weight:500;opacity:.8;margin-left:4px}

.banner{padding:10px 14px;border-radius:6px;border:1px solid var(--warn);color:var(--warn);background:var(--surface);font-weight:500}

/* Day board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;min-width:0}
.day .head{background:var(--c);color:#fff;padding:10px 12px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day .dn{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.day .dd{font-size:12px;opacity:.9;font-weight:500}
.day .items{list-style:none;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.day .items li{display:flex;justify-content:space-between;gap:8px;border-left:3px solid var(--c);padding-left:8px;min-width:0}
.day .items .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.day .items .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.day .items .q{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--c)}
.day .items .q.tbc{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:500}
.day .clear{color:var(--muted);font-size:13px;padding:4px 0}
.day .foot{border-top:1px solid var(--line);padding:7px 12px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .foot b{color:var(--fg)}
.day.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.day:hover:not(.sel){border-color:var(--c)}
.d0{--c:var(--mon)}.d1{--c:var(--tue)}.d2{--c:var(--wed)}.d3{--c:var(--thu)}.d4{--c:var(--fri)}

/* Entry panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.panel .ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:3px solid var(--c)}
.panel h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1}
.panel h2 span{color:var(--c)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input[type=search]{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;width:200px;max-width:100%}
.tools label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.cat{padding:4px 16px 10px}
.cat h3{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px;color:var(--muted);margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.remind{margin:8px 12px 0;padding:6px 8px;border-radius:5px;border:1px solid var(--warn);color:var(--warn);font-size:12px;font-weight:600;line-height:1.3}
.chl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.chl input{width:70px!important;text-align:right}
.cksel.set{border-color:var(--ok)!important;color:var(--ok)}
.sug{margin-top:4px;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sug.done{color:var(--ok)}
.sug button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:5px;padding:2px 8px;font-size:12px;font-weight:600;cursor:pointer}
.type{padding:16px 16px 0}
.type h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
.type p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.c-var{display:flex;flex-direction:column;gap:4px;min-width:0}
.c-qty{display:flex;flex-direction:column;gap:2px;min-width:0}
.bt{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-height:1em}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 92px 76px minmax(0,1.4fr) 64px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.has{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%)}
.row.has .pn{color:var(--fg)}
.row.sub .pn{visibility:hidden}
.pn{font-weight:600;color:var(--muted);padding-left:8px;border-left:3px solid transparent;min-width:0}
.row.has .pn{border-left-color:var(--c)}
.pn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pn .nr{color:var(--warn)}
.row input,.row select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:6px 8px}
.row input.qty{text-align:right;font-family:var(--display);font-weight:600;font-size:18px;padding:3px 8px;font-variant-numeric:tabular-nums}
.row input:disabled,.row select:disabled{opacity:.6}
.acts{display:flex;gap:4px;justify-content:flex-end}
.acts button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;line-height:1;font-size:16px;color:var(--muted)}
.acts button:hover{color:var(--fg);border-color:var(--fg)}
.blank{color:var(--muted);font-size:13px}
.empty{padding:24px 16px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);text-align:right;min-height:1.4em}
.status.err{color:var(--warn)}
footer{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:var(--muted);text-align:center}

@media (max-width:900px){
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .day{flex:0 0 min(240px,78vw);scroll-snap-align:start}
  .row{grid-template-columns:minmax(0,1fr) 84px 70px 64px;grid-template-areas:"pn qty unit acts" "var note note note"}
  .row .pn{grid-area:pn}.row .c-var{grid-area:var}.row .c-qty{grid-area:qty}.row .c-unit{grid-area:unit}.row .c-note{grid-area:note}.row .acts{grid-area:acts}
  .row .c-var:empty{display:none}
  .row.sub .pn{visibility:visible;font-size:0;border-left-color:var(--c)}
}
.wbtn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.weigh{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px}
.weigh[hidden]{display:none}
.weigh .wh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.weigh h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1}
.weigh .wh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.wcard{border-top:2px solid var(--line);margin-top:16px;padding-top:10px;break-inside:avoid}
.wcard h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0}
.wcard .meta{color:var(--muted);font-size:13px;margin:2px 0 8px}
.wcard table{width:100%;border-collapse:collapse;font-size:15px}
.wcard th,.wcard td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.wcard th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wcard td.n,.wcard th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wcard td.tick{width:34px}
.wcard tr.sub td{color:var(--muted);font-size:13px}
.wcard .none{color:var(--warn);font-weight:600;font-size:14px}
.tcard .fields{display:flex;flex-wrap:wrap;gap:8px 14px;margin:6px 0;font-size:14px}
.tcard .fields label{display:flex;align-items:center;gap:6px}
.tcard input[type=text],.tcard input[type=number],.tcard input[type=time],.tcard select,.tcard textarea{font:inherit;border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--surface);color:inherit}
.tcard input[type=number]{width:72px}.tcard input.wide{width:140px}
.tcard table{font-size:19px}
.tcard td.ck{width:44px;vertical-align:middle}.tcard td.ck input{width:28px;height:28px}
.tcard td.ing{width:1%;white-space:nowrap;padding-right:22px}
.tcard td.ing small{white-space:normal;font-size:14px}
.tcard td.n{text-align:left;font-weight:700;font-size:21px}
.tcard tbody tr:nth-child(even) td{background:rgba(127,127,127,.08)}
.tcard tr.step td{font-size:17px}
.tcard tr.step td{font-weight:500}
.tcard tr.step td.n{font-weight:400}
.tcard .chk{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:13px;font-weight:400}
.tcard .chk label{display:flex;align-items:center;gap:4px}
.tcard .flags{margin:8px 0 0}
.tcard .flags p{margin:2px 0;color:var(--warn);font-weight:700}
.tcard .saved{font-size:12px;color:var(--muted)}
.tcard textarea{width:100%;min-height:44px;margin-top:6px}
@media print{
  body *{visibility:hidden}
  body[data-print=weigh] #weigh,body[data-print=weigh] #weigh *,body[data-print=ticks] #ticks,body[data-print=ticks] #ticks *{visibility:visible}
  #weigh,#ticks{position:absolute;left:0;top:0;width:100%;border:0;margin:0;padding:0;background:#fff;color:#000}
  #weigh .noprint,#ticks .noprint{display:none}
  .tcard{break-after:page}
  .tcard input,.tcard select,.tcard textarea{border:0;border-bottom:1px solid #000;border-radius:0}
  .wcard td.tick::before{content:"☐"}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="weekEyebrow">Production schedule</div>
      <h1>Weekly Planner</h1>
    </div>
    <div class="weeknav">
      <button id="prevWeek" aria-label="Previous week">‹ Prev</button>
      <button id="thisWeek">This week</button>
      <button id="nextWeek" aria-label="Next week">Next ›</button>
      <button id="openSettings" aria-label="Settings">Settings</button>
    </div>
  </header>

  <nav class="stages" aria-label="Planning stages">
    <button type="button" class="stage" id="goPlan">1 · Plan</button>
    <button type="button" class="stage" id="goWeigh">2 · Weigh-outs</button>
    <button type="button" class="stage" id="goTicks">3 · Tick lists</button>
  </nav>

  <div id="banner" class="banner" hidden></div>

  <section class="board" id="board" aria-label="Days of the week"></section>

  <section class="panel" id="panel">
    <div class="ph">
      <h2 id="panelTitle"></h2>
      <div class="tools">
        <input type="search" id="search" placeholder="Find a product" aria-label="Find a product">
        <label><input type="checkbox" id="plannedOnly"> Planned only</label>
        <button type="button" class="wbtn" id="openWeigh">Weigh-out sheet</button>
        <button type="button" class="wbtn" id="openTicks">Tick lists</button>
      </div>
    </div>
    <div id="entries"></div>
  </section>
  <section class="weigh" id="weigh" hidden aria-label="Weigh-out sheet"></section>
  <section class="weigh" id="ticks" hidden aria-label="Tick lists"></section>
  <div class="status" id="status"></div>
  <footer>Plan · Produce · Pack · Deliver</footer>
</div>


<div class="dlg" id="settings" hidden>
  <form id="cfgForm" autocomplete="off">
    <h2>Connect this device</h2>
    <label for="cfgUrl">API address<span>The Web app URL from Apps Script, ending in /exec</span><input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label for="cfgKey">Device key<span>The DEVICE_KEY set in Apps Script</span><input id="cfgKey" type="password"></label>
    <label for="cfgPin">Edit PIN<span>Yehuda and Eli only. Leave blank on staff tablets.</span><input id="cfgPin" type="password" inputmode="numeric"></label>
    <p class="msg" id="cfgMsg"></p>
    <div class="btns"><button type="button" id="cfgCancel">Cancel</button><button type="submit">Save and connect</button></div>
  </form>
</div>

<script>
/* ---------- Product catalogue (from the deli's recipe sheets) ---------- */
/* Planning categories: minced = kg of meat block (meat + skin + water + ice + fat); whole = kg of green weight (pre-injection) */
const TYPES={minced:{name:"Minced products",basis:"meat block",hint:"Quantity = kg of meat block (meat + skin + water + ice + fat)"},
             whole:{name:"Whole muscle products",basis:"green weight",hint:"Quantity = kg of green weight (before injection)"}};
const CATS=[
  ["sausage","Frankfurters & sausages","minced"],
  ["salami","Salami & aufschnitt","minced"],
  ["beef","Beef","whole"],
  ["poultry","Poultry","whole"]
];
const CATTYPE=Object.fromEntries(CATS.map(c=>[c[0],c[2]]));
const TUMBLER_MAX=150; // kg per tumbler batch
const DEFAULT_STAGES=["Inject","Cook"];
function stagesOf(p){return p.stages||DEFAULT_STAGES}
function gapsOf(p){return p.gaps||[{min:1}]}
/* old saved lines used "Brine / inject" and "Prep & cook" */
function stageOf(p,l){const ss=stagesOf(p),st=l&&l.st;if(!st||st==="Brine / inject")return ss[0];if(st==="Prep & cook")return ss[1]||ss[0];return ss.includes(st)?st:ss[0]}
function isFirstStage(p,l){return stageOf(p,l)===stagesOf(p)[0]}
const CODES={franks:"FR",double_smoked:"DS",bratwurst:"BW",kielbasa:"KB",liverwurst:"LW",beef_salami:"BS",turkey_salami:"TS",chicken_salami:"CS",wurst:"WU",hungarian:"HU",chorizo:"CH",square_aufschnitt:"SA",pepper_aufschnitt:"PA",salt_beef:"SB",pastrami:"PS",navel_pastrami:"NP",roast_beef:"RB",leanside_chuck:"LC",rauchfleisch:"RF",chicken_breast:"CB",chicken_legs:"CL",turkey_drumsticks:"TD"};
function splitBatches(kg){if(!(kg>0))return null;const n=Math.ceil(kg/TUMBLER_MAX-1e-9);return {n,each:kg/n}}
function batchText(l){if((l.unit||"kg")!=="kg")return "";const b=splitBatches(+l.qty);if(!b)return "";
  return b.n===1?"1 batch":b.n+" × "+fmt(Math.round(b.each*100)/100)+" kg"}
const PRODUCTS=[
  {id:"franks",cat:"sausage",name:"Franks",sub:"150kg base · chilli split off the same mix",chilli:true,variants:["Fresh flank","Fresh trim","Defrosted flank"]},
  {id:"double_smoked",cat:"sausage",name:"Double smoked franks",sub:"60kg base recipe"},
  {id:"bratwurst",cat:"sausage",name:"Bratwurst",sub:"60kg base recipe"},
  {id:"kielbasa",cat:"sausage",name:"Kielbasa",sub:"20kg · hold overnight, cook 42"},
  {id:"liverwurst",cat:"sausage",name:"Liverwurst",sub:"30kg base recipe"},

  {id:"beef_salami",cat:"salami",name:"Beef salami",sub:"100 / 120kg batch"},
  {id:"turkey_salami",cat:"salami",name:"Turkey salami",sub:"150kg base recipe"},
  {id:"chicken_salami",cat:"salami",name:"Chicken salami",sub:"120kg base recipe"},
  {id:"wurst",cat:"salami",name:"Wurst",sub:"60kg batch"},
  {id:"hungarian",cat:"salami",name:"Hungarian / Krakowska",sub:"25kg · cook 11, air dry 2½–3 wks"},
  {id:"chorizo",cat:"salami",name:"Chorizo",sub:"25kg · cook 13, air dry 2½–3 wks"},
  {id:"square_aufschnitt",cat:"salami",name:"Square aufschnitt",sub:"68.5kg base · 14 presses",saltBeef:{perKg:9.5/68.5}},
  {id:"pepper_aufschnitt",cat:"salami",name:"Roast pepper / olive aufschnitt",sub:"40kg base recipe",variants:["Half pepper · half olive","All pepper","All olive"],saltBeef:{perKg:{"Half pepper · half olive":0.075,"All olive":0.15},skipVariant:"All pepper"}},

  {id:"salt_beef",cat:"beef",name:"Salt beef",sub:"20% pickup",pickup:.20,tumble:"Tumble",stages:["Inject","Tumble","Cook"],gaps:[{min:5,max:7},{min:1}],brine:{"60L brine":"brine_sb60","Downstairs brine":"brine_down"},flow:{min:5,max:7},variants:["60L brine","Downstairs brine"]},
  {id:"pastrami",cat:"beef",name:"Pastrami",sub:"28% pickup",pickup:.28,brine:"brine_sb60",flow:{min:1}},
  {id:"navel_pastrami",cat:"beef",name:"Navel pastrami",sub:"40% pickup",pickup:.40,brine:"brine_navel",flow:{min:1}},
  {id:"roast_beef",cat:"beef",name:"Roast beef",sub:"60L brine · no cure",brine:"brine_sb60",noCure:true,flow:{min:1}},
  {id:"leanside_chuck",cat:"beef",name:"Leanside chuck",sub:"60L salt beef brine",pickup:.20,tumble:"Tumble",stages:["Inject","Tumble","Cook"],gaps:[{min:5,max:7},{min:1}],brine:"brine_sb60",flow:{min:5,max:7}},
  {id:"rauchfleisch",cat:"beef",name:"Rauchfleisch",sub:"2-week cure",calc:"equilibrium",stages:["Brine","Smoke & sous vide"],gaps:[{min:14}],flow:{min:14,what:"Smoke"}},

const PMAP=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));

/* ---------- Dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseIso(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function defaultMonday(){const t=new Date();t.setHours(0,0,0,0);const wd=t.getDay();
  if(wd===0)return addDays(t,1); if(wd===6)return addDays(t,2); if(wd===5)return addDays(t,3); return addDays(t,1-wd)}
function weekLabel(mon){const fri=addDays(mon,4);
  if(mon.getMonth()===fri.getMonth())return mon.getDate()+"–"+fri.getDate()+" "+MONTHS[mon.getMonth()]+" "+mon.getFullYear();
  return mon.getDate()+" "+MONTHS[mon.getMonth()].slice(0,3)+" – "+fri.getDate()+" "+MONTHS[fri.getMonth()].slice(0,3)+" "+fri.getFullYear()}

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

  return Object.entries(l).filter(([,v])=>v&&typeof v==="object").map(([id,v])=>({id,...v})).sort((a,b)=>(a.o||0)-(b.o||0))}
function isReal(l){return (l.qty!==null&&l.qty!==""&&l.qty!==undefined&&+l.qty>0)||(l.note&&l.note.trim())}

/* Day-before reminders: cubed salt beef for aufschnitt */
let nextMon={lines:{}}; // next week's Monday lines (for Friday reminders)
function prevWorkday(i){return i>0?i-1:null}
function sbPerKg(p,l){const k=p.saltBeef.perKg;if(k&&typeof k==="object")return k[l.v||(p.variants||[])[0]]||null;return k||null}
function remindersFor(i){
  const out=[];
  const srcLines=i<4?linesFor(DAYS[i+1][0]):Object.entries(nextMon.lines||{}).filter(([,v])=>v&&typeof v==="object").map(([id,v])=>({id,...v}));
  const target=i<4?DAYS[i+1][1]:"next Monday";
  for(const l of srcLines.filter(isReal)){
    const p=PMAP[l.p];if(!p||!p.saltBeef)continue;

    const pk=sbPerKg(p,l),kg=+l.qty>0&&(l.unit||"kg")==="kg"&&pk?Math.round(+l.qty*pk*10)/10:null;

  }

}

/* Batch codes: YYDDD-PP-N (year, day of year, product, batch number of that product that day) */
function yyddd(d){const j=new Date(d.getFullYear(),0,1);const n=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-j)/864e5)+1;
  return String(d.getFullYear()%100).padStart(2,"0")+String(n).padStart(3,"0")}
function nBatches(l){const b=(l.unit||"kg")==="kg"?splitBatches(+l.qty):null;return b?b.n:1}
function batchCodes(p,l,dayKey){
  if(l.codes&&l.codes.length)return l.codes;
  const di=DAYS.findIndex(d=>d[0]===dayKey), d=addDays(monday,di<0?selDay:di);
  const same=linesFor(dayKey).filter(x=>x.p===l.p&&!x.src&&isReal(x)&&isFirstStage(p,x));
  let start=1;for(const x of same){if(x.id===l.id||x===l)break;start+=nBatches(x)}
  const code=CODES[p.id]||p.id.slice(0,2).toUpperCase();
  return Array.from({length:nBatches(l)},(_,i)=>yyddd(d)+"-"+code+"-"+(start+i));
}
function chilliCode(l,dayKey){const di=DAYS.findIndex(d=>d[0]===dayKey);const d=addDays(monday,di);
  const same=linesFor(dayKey).filter(x=>x.p==="franks"&&+x.ch>0&&!x.src);let n=1;for(const x of same){if(x.id===l.id)break;n++}
  return yyddd(d)+"-CF-"+n}

/* Cook-date suggestion for whole muscle lines at the brine / inject stage */
const DAYKEYS=["sun","mon","tue","wed","thu","fri","sat"];
function nextWorkday(d){const t=new Date(d);while(t.getDay()===0||t.getDay()===6)t.setDate(t.getDate()+1);return t}
function shortDate(d){return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)}
function linksOf(p,l){if(!l)return [];if(l.links)return l.links;
  if(l.cki)return [{id:l.cki,wk:l.ckw,dk:l.ckd,st:stagesOf(p)[1]||"Cook",d:l.ck}];return []}
function isBrineStage(p,l){return CATTYPE[p.cat]==="whole"&&stagesOf(p).length>1&&isFirstStage(p,l)&&!l.src}
function cookOptions(p,dayIdx){
  const g=gapsOf(p)[0];const base=addDays(monday,dayIdx);const out=[];
  if(g.max){for(let d=g.min;d<=g.max;d++){const t=addDays(base,d);if(t.getDay()!==0&&t.getDay()!==6)out.push(t)}
    if(!out.length)out.push(nextWorkday(addDays(base,g.min)));}
  else{let t=nextWorkday(addDays(base,g.min));out.push(t);for(let i=0;i<2;i++){t=nextWorkday(addDays(t,1));out.push(t)}}
  return out;
}
function cookSelHtml(p,l,id,dis){
  if(!l||!isBrineStage(p,l)||!(+l.qty>0))return "";
  const nxt=stagesOf(p)[1],what=nxt.toLowerCase();
  const opts=cookOptions(p,selDay);
  if(l.ck&&!opts.some(d=>iso(d)===l.ck))opts.push(parseIso(l.ck));
  return `<select id="k-${id}" data-f="ckd" aria-label="${esc(p.name)} ${what} day" class="cksel${l.ck?" set":""}"${dis}>
    <option value="">Choose ${what} day…</option>
    ${opts.map((d,i)=>`<option value="${iso(d)}"${l.ck===iso(d)?" selected":""}>${esc(nxt)} ${shortDate(d)}${i===0?" (earliest)":""}</option>`).join("")}
  </select>`;
}
function buildNext(src,st,codes){const p=PMAP[src.p];
  return {p:src.p,qty:src.qty,unit:src.unit||"kg",v:src.v||null,st,src:1,start:src.inj,codes,note:stagesOf(p)[0]+" "+shortDate(parseIso(src.inj)),o:Date.now()};
}
function relinkAll(src,id){const p=PMAP[src.p];const codes=batchCodes(p,{...src,id},DAYS[selDay][0]);
  linksOf(p,src).forEach(k=>putLine(k.wk,k.dk,k.id,buildNext(src,k.st,codes)))}
function putLine(wk,dk,id,val){if(wk===weekId)dayLines(dk)[id]=val;queueW(wk,dk,id,val)}
function setCookDay(srcId,val){
  const k=DAYS[selDay][0];const lines=dayLines(k);const src=lines[srcId];if(!src)return;
  const p=PMAP[src.p];
  linksOf(p,src).forEach(k=>putLine(k.wk,k.dk,k.id,null));
  delete src.ck;delete src.cki;delete src.ckw;delete src.ckd;delete src.links;
  if(val){
    src.inj=iso(addDays(monday,selDay));
    const codes=batchCodes(p,{...src,id:srcId},k);
    const ss=stagesOf(p),gs=gapsOf(p);let t=parseIso(val);const links=[];
    for(let i=1;i<ss.length;i++){
      if(i>1)t=nextWorkday(addDays(t,(gs[i-1]||{min:1}).min));
      const wk=iso(addDays(t,1-t.getDay())),dk=DAYKEYS[t.getDay()],nid=newId();
      putLine(wk,dk,nid,buildNext(src,ss[i],codes));links.push({id:nid,wk,dk,st:ss[i],d:iso(t)});
    }
    Object.assign(src,{ck:val,links});
    setStatus(links.map(x=>x.st+" "+shortDate(parseIso(x.d))).join(", ")+" added");
  }
  queue(k,srcId,{...src});render();
}
function rowHtml(p,l,isFirst,dayKey){

  const isWhole=CATTYPE[p.cat]==="whole";

  const vSel=stSel+cookSelHtml(p,l,id,dis)+(p.variants?`<select id="v-${id}" data-f="v" aria-label="${esc(p.name)} recipe"${dis}>${p.variants.map(v=>`<option${(l?.v||p.variants[0])===v?" selected":""}>${esc(v)}</option>`).join("")}</select>`:"");

  return `<div class="row${has?" has":""}${isFirst?"":" sub"}" data-line="${id}" data-p="${p.id}">
    <div class="pn">${esc(p.name)}<small${p.norecipe?' class="nr"':""}>${esc(p.sub)}</small></div>
    <div class="c-var">${vSel}</div>
    <div class="c-qty"><input class="qty" id="q-${id}" data-f="qty" inputmode="decimal" placeholder="—" value="${l&&l.qty!==null&&l.qty!==undefined?esc(l.qty):""}" aria-label="${esc(p.name)} quantity"${dis}><span class="bt" id="b-${id}">${esc(bt)}</span></div>
    <div class="c-unit"><select id="u-${id}" data-f="unit" aria-label="Unit"${dis}>${UNITS.map(u=>`<option${u===unit?" selected":""}>${u}</option>`).join("")}</select></div>
    <div class="c-note">${p.chilli?`<label class="chl" for="c-${id}">Of which chilli (kg)<input id="c-${id}" data-f="ch" inputmode="decimal" placeholder="0" value="${l&&l.ch!=null?esc(l.ch):""}"${dis}></label>`:""}<input id="n-${id}" data-f="note" placeholder="Note" value="${esc(l?.note||"")}" aria-label="${esc(p.name)} note"${dis}></div>
    <div class="acts">${acts}</div>
  </div>`}

function renderEntries(){
  const [k,name]=DAYS[selDay];

function render(){renderBoard();renderEntries();if(!$("weigh").hidden)renderWeigh();if(!$("ticks").hidden&&!$("ticks").contains(document.activeElement)){if(recWeek!==weekId)loadRecords().then(renderTicks);else renderTicks()}}

/* ---------- Editing ---------- */
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function dayLines(k){plan.days=plan.days||{};plan.days[k]=plan.days[k]||{lines:{}};plan.days[k].lines=plan.days[k].lines||{};return plan.days[k].lines}

function onField(e){
  const el=e.target;const f=el.dataset.f;if(!f)return;
  const row=el.closest(".row");const k=DAYS[selDay][0];const lines=dayLines(k);
  if(f==="ckd"){setCookDay(row.dataset.line,el.value);return}
  let id=row.dataset.line;const p=PMAP[row.dataset.p];
  if(id.startsWith("new-")){
    if(f!=="qty"&&f!=="note"&&f!=="ch")return; // changing unit/variant on a blank row waits until something is entered
    if(!el.value.trim())return;
    const nid=newId();
    const maxO=Math.max(0,...Object.values(lines).filter(Boolean).map(l=>l.o||0));
    lines[nid]={p:p.id,qty:null,unit:row.querySelector('[data-f=unit]').value,v:row.querySelector('[data-f=v]')?.value||null,st:row.querySelector('[data-f=st]')?.value||null,note:"",o:maxO+1};
    row.dataset.line=nid;
    row.querySelectorAll("[id]").forEach(x=>x.id=x.id.replace("new-"+p.id,nid));
    id=nid;
  }
  const line=lines[id];if(!line)return;
  if(f==="qty"||f==="ch"){const v=el.value.replace(",",".").trim();line[f]=v===""?null:(isNaN(+v)?line[f]:+v)}
  else line[f]=el.value;
  row.classList.toggle("has",isReal(line));
  const btEl=row.querySelector(".bt");if(btEl)btEl.textContent=+line.qty>0?batchText(line):"";
  if(linksOf(p,line).length&&(f==="qty"||f==="v"||f==="unit"))relinkAll(line,id);
  if(f==="st"&&linksOf(p,line).length&&!isFirstStage(p,line)){setCookDay(id,"");return}
  if(f==="st")render();
  queue(k,id,{...line});
  renderBoard();
}
function removeLine(id){
  const k=DAYS[selDay][0];const lines=dayLines(k);
  const src=lines[id];if(src)linksOf(PMAP[src.p],src).forEach(k=>putLine(k.wk,k.dk,k.id,null));
  lines[id]=null;queue(k,id,null);render();
}
function addLine(pid){
  const k=DAYS[selDay][0];const lines=dayLines(k);const p=PMAP[pid];
  const maxO=Math.max(0,...Object.values(lines).filter(Boolean).map(l=>l.o||0));
  const nid=newId();lines[nid]={p:pid,qty:null,unit:p.unit||"kg",v:p.variants?p.variants[0]:null,st:CATTYPE[p.cat]==="whole"?stagesOf(p)[0]:null,note:"",o:maxO+1};
  queue(k,nid,{...lines[nid]});render();$("q-"+nid)?.focus();
}

/* ---------- Persistence (Google Apps Script backend) ----------
   Connection settings live on each device (never in this public repo):
   API URL + device key (+ edit PIN for Yehuda / Eli). */
const CFG_KEY="deli.config";
function getCfg(){try{return JSON.parse(ls(CFG_KEY)||"{}")}catch(e){return {}}}
function setCfg(c){ls(CFG_KEY,JSON.stringify(c))}
let cfg=getCfg(), pollTimer=null, lastTyping=0;

function setStatus(t,err){const s=$("status");s.textContent=t;s.classList.toggle("err",!!err)}
function queueW(week,day,id,val){pending.set(week+"|"+day+"|"+id,val);clearTimeout(timer);timer=setTimeout(flush,700)}
function queue(day,id,val){lastTyping=Date.now();pending.set(weekId+"|"+day+"|"+id,val);setStatus("Saving…");clearTimeout(timer);timer=setTimeout(flush,700)}

async function api(action,params,body){
  if(!cfg.url)throw {code:"no_config"};
  if(body){
    const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action,key:cfg.key,pin:cfg.pin||"",...body})});
    const j=await r.json();if(!j.ok)throw j;return j;
  }
  const q=new URLSearchParams({action,key:cfg.key||"",...params});
  const r=await fetch(cfg.url+(cfg.url.includes("?")?"&":"?")+q.toString());
  const j=await r.json();if(!j.ok)throw j;return j;
}

async function flush(){
  clearTimeout(timer);
  if(writing){timer=setTimeout(flush,300);return}
  if(!pending.size)return;
  if(readOnly){pending.clear();return}
  writing=true;
  const batch=new Map(pending);pending.clear();
  const byWeek={};
  for(const [key,val] of batch){const [w,d,id]=key.split("|");(byWeek[w]=byWeek[w]||[]).push({day:d,id,line:val})}
  try{
    for(const [w,changes] of Object.entries(byWeek)){
      if(localMode){
        let cur={};try{cur=JSON.parse(ls("deli.week."+w)||"{}")}catch(e){}
        cur.days=cur.days||{};
        for(const c of changes){cur.days[c.day]=cur.days[c.day]||{lines:{}};cur.days[c.day].lines[c.id]=c.line}
        ls("deli.week."+w,JSON.stringify(cur));continue;
      }
      await api("patch",null,{week:w,changes});
    }
    setStatus(localMode?"Saved on this device only":"Saved · "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    if(e&&e.code==="bad_pin"){readOnly=true;showBanner("Edit PIN not accepted. The plan is view only on this device. Open Settings to fix it.");render()}
    else if(e&&e.code==="bad_key"){showBanner("Device key not accepted. Open Settings to fix it.")}
    else{for(const [k,v] of batch)if(!pending.has(k))pending.set(k,v);setStatus("Couldn't save, retrying… check the internet connection.",true);timer=setTimeout(flush,4000)}
  }finally{writing=false}
}

function applyPending(){
  for(const [key,val] of pending){const [w,d,id]=key.split("|");if(w!==weekId)continue;dayLines(d)[id]=val}
}
function showBanner(t){const b=$("banner");b.textContent=t;b.hidden=!t}

async function fetchWeek(quiet){
  const myWeek=weekId;
  try{
    const j=await api("week",{week:myWeek});
    if(myWeek!==weekId)return;
    if(pending.size||writing||Date.now()-lastTyping<3000)return; // don't overwrite while someone is typing
    plan=j.plan&&j.plan.days?j.plan:{days:{}};
    try{const n=await api("week",{week:iso(addDays(monday,7))});if(myWeek===weekId)nextMon=(n.plan&&n.plan.days&&n.plan.days.mon)||{lines:{}}}catch(e){}
    applyPending();render();
    if(!quiet)setStatus("Up to date");
  }catch(e){
    if(e&&e.code==="bad_key")showBanner("Device key not accepted. Open Settings to fix it.");
    else if(!quiet)setStatus("Couldn't load the plan. Check the internet connection.",true);
  }
}

function loadWeek(){
  weekId=iso(monday);plan={days:{}};nextMon={lines:{}};
  if(localMode){

async function connect(){

    const rows=tickRows(p,l);
    for(let bi=0;bi<n;bi++){
      const ch=p.chilli&&+l.ch>0?+l.ch/n:0;
      const extraRow=r=>{
        if(r.chk==="chilli"){if(!ch)return "";const cr=recipeRows(p,l,"chilli").filter(x=>!x.step);
          return cr.map(x=>`<tr><td></td><td class="ing">${esc(x.ing)} (chilli, ${fmt(Math.round(ch*10)/10)} kg · ${esc(chilliCode(l,dayKey))})</td><td class="n">${gfmt(x.g*ch/x.per)} g</td></tr>`).join("")}
        if(r.chk==="saltbeef"&&p.saltBeef){const pk=sbPerKg(p,l);return pk?`<tr><td></td><td class="ing">Cubed salt beef (prepped the day before)</td><td class="n">${fmt(Math.round(each*pk*10)/10)} kg</td></tr>`:""}
        return "";
      };
      const rauch=p.calc==="equilibrium"&&isFirstStage(p,l)&&unitOk?rauchCard(p,{...l,qty:each},true):"";
      html+=tickCard({key:`${weekId}|${dayKey}|${l.id}|${bi+1}`,title:p.name+(isWhole?" · "+stg:""),
        meta:[unitOk?fmt(Math.round(each*100)/100)+" kg "+(isWhole?"green weight":"meat block")+(n>1?` (batch ${bi+1} of ${n})`:""):"Quantity not in kg",l.v,l.note,shortDate(parseIso(date))].filter(Boolean).join(" · "),
        code:codes[bi],kg:unitOk?Math.round(each*100)/100:null,rows,factor:()=>each,
        hasIntake:!isWhole||isFirstStage(p,l),extraRow,extraTop:rauch,
        target:p.pickup&&stg===(p.tumble||stagesOf(p)[0])?Math.round(each*(1+p.pickup)*10)/10:null,
        product:p.name,stage:stg,dayKey,date});
    }
  }
  return html;
}
async function renderTicks(){
  const [k,name]=DAYS[selDay], d=addDays(monday,selDay);
  const status=localMode?"Not connected: records stay on this device only.":recipes===null?(recipesErr?recipeErrText():"Loading recipes…"):!recipes.length?"No recipes in the sheet yet.":"";
  $("ticks").innerHTML=`<div class="wh"><div><h2>Tick lists · ${name} ${d.getDate()} ${MONTHS[d.getMonth()]}</h2>
    <p>One per batch. Fill in on the tablet, or print and fill in by hand. Records save to the Google Sheet.</p>${status?`<p class="none">${esc(status)}</p>`:""}</div>
    <div class="noprint"><button type="button" class="wbtn" id="printTicks">Print</button> ${!readOnly&&!localMode?`<button type="button" class="wbtn" id="makeReport">Make report</button> `:""}<button type="button" class="wbtn" id="closeTicks">Close</button></div></div>
    ${ticksFor(k)||`<p>Nothing planned for ${name}.</p>`}`;
}
function setPath(o,path,val){const ps=path.split(".");let x=o;for(let i=0;i<ps.length-1;i++){x[ps[i]]=x[ps[i]]||{};x=x[ps[i]]}x[ps[ps.length-1]]=val}
function saveRec(key){
  clearTimeout(recTimers[key]);
  recTimers[key]=setTimeout(async()=>{
    const rec=records[key];if(!rec)return;const sv=$("sv-"+key);
    if(localMode){ls("deli.rec."+weekId,JSON.stringify(records));if(sv)sv.textContent="Saved on this device";return}
    try{if(sv)sv.textContent="Saving…";await api("record",null,{record:rec});rec.updated=new Date().toISOString();if(sv)sv.textContent="Saved"}
    catch(e){if(sv)sv.textContent="Not saved, check connection";}
  },700);
}
function onTick(e){
  const t=e.target,key=t.dataset.rk;if(!key)return;const rec=records[key];if(!rec)return;
  setPath(rec,t.dataset.k,t.type==="checkbox"?t.checked:t.value);
  summarise(rec,tickCtx[key]||[]);
  const fl=$("fl-"+key);if(fl)fl.innerHTML=rec.flags.map(x=>`<p>⚠ ${esc(x)}</p>`).join("");
  saveRec(key);
}
$("ticks").addEventListener("input",onTick);
$("ticks").addEventListener("change",e=>{if(e.target.type==="checkbox"||e.target.tagName==="SELECT")onTick(e)});
$("ticks").addEventListener("click",async e=>{
  if(e.target.id==="printTicks"){document.body.dataset.print="ticks";window.print()}
  else if(e.target.id==="closeTicks")$("ticks").hidden=true;
  else if(e.target.id==="makeReport"){const b=e.target;b.disabled=true;setStatus("Making the report…");
    try{const j=await api("report",null,{week:weekId});const r=j.result||{};setStatus(`Report made: ${r.count||0} tick lists, ${r.flagged||0} flagged${r.emailed?", emailed":""}. Saved in Google Drive.`)}
    catch(err){setStatus(err&&err.code==="bad_pin"?"Only Yehuda and Eli can make the report.":err instanceof SyntaxError?"Couldn't make the report: the script needs authorising. Open Apps Script and run testReport once.":err&&err.message?"Couldn't make the report: "+err.message:"Couldn't make the report.",true)}
    b.disabled=false}
});
$("openTicks").onclick=async()=>{$("ticks").hidden=false;if(!localMode&&!recipes)await loadRecipes();await loadRecords();renderTicks();$("ticks").scrollIntoView({block:"start"})};

/* Top stage buttons */
function markStage(){$("goWeigh").classList.toggle("on",!$("weigh").hidden);$("goTicks").classList.toggle("on",!$("ticks").hidden);
  $("goPlan").classList.toggle("on",$("weigh").hidden&&$("ticks").hidden)}
$("goPlan").onclick=()=>{$("weigh").hidden=true;$("ticks").hidden=true;markStage();$("panel").scrollIntoView({block:"start"})};
$("goWeigh").onclick=()=>{$("ticks").hidden=true;$("openWeigh").click();markStage()};
$("goTicks").onclick=async()=>{$("weigh").hidden=true;await $("openTicks").onclick();markStage()};
new MutationObserver(markStage).observe($("weigh"),{attributes:true,attributeFilter:["hidden"]});
new MutationObserver(markStage).observe($("ticks"),{attributes:true,attributeFilter:["hidden"]});
markStage();

/* ---------- Settings dialog ---------- */
function openSettings(){
  const c=getCfg();$("cfgUrl").value=c.url||"";$("cfgKey").value=c.key||"";$("cfgPin").value=c.pin||"";
  $("cfgMsg").textContent="";$("settings").hidden=false;$("cfgUrl").focus();
}
$("openSettings").onclick=openSettings;
$("cfgCancel").onclick=()=>{$("settings").hidden=true};
$("cfgForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const c={url:$("cfgUrl").value.trim(),key:$("cfgKey").value.trim(),pin:$("cfgPin").value.trim()};
  if(c.url&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(c.url)){$("cfgMsg").textContent="The API address should start https://script.google.com/macros/s/ and end /exec";return}
  setCfg(c);$("cfgMsg").textContent="Connecting…";
  await connect();$("settings").hidden=true;
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!localMode)fetchWeek(true)});

/* ---------- Events ---------- */
$("board").addEventListener("click",e=>{const d=e.target.closest(".day");if(!d)return;selDay=+d.dataset.day;ls("deli.selDay",String(selDay));render();
  if(window.matchMedia("(max-width:900px)").matches)$("panel").scrollIntoView({block:"start"})});
$("entries").addEventListener("input",e=>{if(e.target.matches("input"))onField(e)});
$("entries").addEventListener("change",e=>{if(e.target.matches("select"))onField(e);else if(e.target.dataset.f==="qty")render()});
$("entries").addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;
  const row=b.closest(".row");if(b.dataset.act==="del")removeLine(row.dataset.line);else addLine(b.dataset.p)});
$("search").addEventListener("input",renderEntries);
$("plannedOnly").addEventListener("change",renderEntries);
function shift(n){flush();monday=addDays(monday,n*7);loadWeek()}
$("prevWeek").onclick=()=>shift(-1);
$("nextWeek").onclick=()=>shift(1);
$("thisWeek").onclick=()=>{flush();monday=defaultMonday();loadWeek()};
window.addEventListener("pagehide",flush);

init();
</script>
